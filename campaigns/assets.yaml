# 광고 애셋(구 광고 확장) 설계
#
# 애셋은 광고가 차지하는 면적을 늘리고 클릭 전에 궁금증을 해소해 줍니다.
# 같은 순위여도 애셋이 붙은 광고가 CTR·전환율이 높습니다. RSA 문안만 잘 써도
# 애셋이 없으면 광고는 두 줄짜리로 나갑니다.
#
# 한국어 전각 기준 글자 수 제한 (영문 제한의 절반):
#   사이트링크 텍스트 12자 / 사이트링크 설명 17자
#   콜아웃 12자 / 구조화된 스니펫 값 12자
# scripts/make_editor_csv.py 가 실행 시 자동 검사합니다.

# 어느 캠페인에 붙일지: campaigns/plan.yaml 의 캠페인 id 목록
# (bell = 비상벨 캠페인 전체, click = 헬로클릭, brand = 브랜드)
groups:
  bell: [bell_legal, bell_general, brand]
  click: [click_edu, brand]

sitelinks:
  bell:
    - text: 견적 문의
      desc1: 수량과 현장만 알려주세요
      desc2: 당일 견적서 발행
      landing: disabled_toilet
    - text: 장애인화장실용
      desc1: 점자안내판 포함 구성
      desc2: 법정 설치기준 충족
      landing: disabled_toilet
    - text: 제품 라인업
      desc1: 화장실 시설 가정용까지
      desc2: 용도별로 비교하세요
      landing: wireless
    - text: 대량구매 상담
      desc1: 세금계산서 발행 가능
      desc2: 수량별 할인 안내
      landing: facility
    - text: 설치 방법
      desc1: 배선 공사 없이 부착
      desc2: 5분이면 사용 가능
      landing: wireless
    - text: 자주 묻는 질문
      desc1: 배터리 수신거리 A/S
      desc2: 구매 전 확인하세요
      landing: wireless
  click:
    - text: 헬로클릭 소개
      desc1: 학생 전원의 응답 확인
      desc2: 참여도 실시간 대시보드
      landing: srs
    - text: 학교 렌탈 안내
      desc1: 예산 부담 없이 도입
      desc2: 견적서 바로 발행
      landing: school_buy
    - text: 활용 사례
      desc1: 골든벨 퀴즈 형성평가
      desc2: 수업 적용 예시 보기
      landing: quiz
    - text: 도입 문의
      desc1: 학급 규모에 맞춰 안내
      desc2: 구성과 수량 제안
      landing: school_buy

callouts:
  bell:
    - 배선공사 불필요
    - 스마트폰 수신
    - 당일 출고
    - 세금계산서 발행
    - 관공서 납품실적
    - 대량구매 할인
    - 설치 상담 무료
    - 정품 A/S 보장
  click:
    - 학교 렌탈 가능
    - 앱 설치 불필요
    - 전원 동시 응답
    - 수업 준비 5분
    - 견적서 발행
    - 학교 납품 실적

# 구조화된 스니펫: 헤더 유형 + 값 4개 이상 (많을수록 좋음)
snippets:
  bell:
    - header: 유형
      values: [비상벨, 도움벨, 호출벨, 수신기, 경광등, 점자안내판]
    - header: 서비스
      values: [현장 견적, 설치 상담, 대량 납품, A/S, 세금계산서]
  click:
    - header: 유형
      values: [학생응답기, 수신기, 대시보드, 수업콘텐츠, 렌탈]

# 아래는 Editor CSV로 만들지 않고 Google Ads 화면에서 직접 설정합니다.
manual:
  call:
    note: 전화 애셋. 전화 클릭을 전환으로 잡기 위해 반드시 필요합니다.
    phone: ""            # ← 대표번호를 넣으세요
    schedule: 평일 09:00-18:00
  lead_form:
    note: >
      리드 양식 애셋. 비상벨은 관공서·학교 대량 문의가 핵심이라 효과가 큽니다.
      광고에서 바로 문의를 받아 랜딩 이탈을 줄입니다.
    headline: 비상벨 견적 문의
    fields: [이름, 회사/기관명, 연락처, 이메일, 설치 현장 유형]
  location:
    note: 위치 애셋. 사업자 주소가 노출되면 관공서 담당자 신뢰도가 올라갑니다.
  price:
    note: >
      가격 애셋. 헬로클릭은 '기본 세트 220,000원'처럼 가격이 명확해서 잘 맞습니다.
      비상벨은 구성별 편차가 커서 오히려 이탈을 만들 수 있으니 신중히.
  image:
    note: 이미지 애셋. 규격과 준비 방법은 docs/assets.md 참고.

# 애셋 실적 판정 기준 (scripts/assets.py)
performance_labels:
  best: [최우수, Best]
  good: [양호, Good]
  low: [낮음, Low]
  learning: [학습 중, 학습중, Learning, Pending]
  none: [평가 없음, 없음, "--", None, "-"]

# 캠페인마다 최소한 갖춰야 할 애셋 (커버리지 진단 기준)
coverage_minimum:
  sitelink: 4
  callout: 4
  snippet: 1
  call: 1
  image: 1
