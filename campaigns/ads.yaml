# 반응형 검색광고(RSA) 문안
# 한국어는 전각 문자로 계산되어 헤드라인 15자 / 설명 45자 제한입니다.
# scripts/make_editor_csv.py 실행 시 자동 검사되며, 초과하면 오류로 알려줍니다.
#
# pin_h1: 첫 번째 헤드라인을 1번 위치에 고정할지 여부.
#   키워드와 정확히 일치하는 문구를 1번에 고정하면 CTR 방어에 유리합니다.

rsa_disabled_toilet:
  pin_h1: true
  headlines:
    - 장애인화장실 비상벨
    - 법정 설치기준 충족
    - 점자안내판 포함
    - 배선공사 없이 설치
    - 스마트폰으로 수신
    - 무선 비상벨 전문
    - 관공서 학교 납품
    - 대량구매 견적상담
    - 헬로벨 공식스토어
    - 당일 출고 가능
    - 세금계산서 발행
    - 설치 문의 환영
  descriptions:
    - 장애인화장실 설치기준에 맞춘 비상벨 세트. 수신기와 점자안내판 포함.
    - 배선 공사 없이 부착만 하면 끝. 스마트폰으로 어디서든 호출을 받습니다.
    - 관공서 학교 병원 납품 실적. 세금계산서 발행과 대량 견적 상담 가능.
    - 모델 선택이 어려우면 문의 주세요. 현장에 맞는 구성을 안내드립니다.

rsa_public_toilet:
  pin_h1: true
  headlines:
    - 공중화장실 비상벨
    - 화장실 안심벨 설치
    - 무선 설치 5분 완료
    - 스마트폰으로 수신
    - 방수 비상벨 세트
    - 경광등 연동 가능
    - 관공서 납품 실적
    - 대량구매 견적상담
    - 헬로벨 공식스토어
    - 당일 출고 가능
    - 설치 문의 환영
  descriptions:
    - 화장실 비상벨 설치 기준에 맞춘 무선 세트. 방수 버튼과 수신기 구성.
    - 배선 공사 없이 부착 설치. 관리자 스마트폰으로 즉시 알림이 갑니다.
    - 지자체 관공서 납품 실적 보유. 세금계산서 발행과 대량 견적 가능.
    - 설치 현장 사진을 보내주시면 맞는 구성을 무료로 제안해 드립니다.

rsa_regulation:
  pin_h1: false
  headlines:
    - 비상벨 설치 기준
    - 법정 설치기준 안내
    - 장애인화장실 기준
    - 공중화장실 비상벨
    - 무료 설치 상담
    - 현장 맞춤 견적
    - 헬로벨 공식스토어
    - 관공서 납품 실적
    - 세금계산서 발행
  descriptions:
    - 어떤 비상벨을 설치해야 하는지 기준부터 정리해 안내해 드립니다.
    - 현장 유형만 알려주시면 필요한 구성과 수량을 무료로 잡아드립니다.
    - 관공서 학교 병원 납품 실적. 견적서와 세금계산서 모두 발행 가능.
    - 배선 공사 없는 무선 방식이라 기존 건물에도 바로 설치됩니다.

rsa_wireless:
  pin_h1: true
  headlines:
    - 무선 비상벨
    - 공사 없이 설치
    - 스마트폰으로 수신
    - 거리 제한 없음
    - 방수 비상 버튼
    - 수신기 세트 구성
    - 헬로벨 공식스토어
    - 당일 출고 가능
    - 대량구매 견적상담
    - 세금계산서 발행
    - 설치 문의 환영
    - 현장 맞춤 구성
  descriptions:
    - 배선 공사 없는 무선 비상벨. 부착만 하면 바로 사용할 수 있습니다.
    - 스마트폰으로 호출을 받으니 수신기 거리에 얽매이지 않습니다.
    - 화장실 사무실 병원 매장까지. 현장에 맞는 구성으로 제안드립니다.
    - 대량 구매 견적과 세금계산서 발행 가능. 문의 주시면 바로 답변드립니다.

rsa_facility:
  pin_h1: false
  headlines:
    - 시설용 무선 비상벨
    - 병원 요양원 비상벨
    - 학교 관공서 비상벨
    - 사무실 경비실 설치
    - 공사 없이 설치
    - 스마트폰으로 수신
    - 다중 버튼 구성
    - 대량구매 견적상담
    - 세금계산서 발행
    - 헬로벨 공식스토어
  descriptions:
    - 병원 요양원 학교 관공서까지 현장별 구성으로 제안해 드립니다.
    - 버튼 여러 개를 한 수신기로. 어느 위치에서 눌렀는지 바로 확인됩니다.
    - 배선 공사 없이 설치. 기존 건물에도 그대로 적용할 수 있습니다.
    - 수량과 현장만 알려주세요. 견적서와 세금계산서 발행 가능합니다.

rsa_home_care:
  pin_h1: false
  headlines:
    - 가정용 무선 호출벨
    - 어르신 호출벨
    - 환자 침대 호출벨
    - 공사 없이 설치
    - 스마트폰으로 수신
    - 거리 제한 없음
    - 방수 버튼 구성
    - 헬로벨 공식스토어
    - 당일 출고 가능
  descriptions:
    - 어르신과 환자가 누르면 보호자 스마트폰으로 바로 알림이 갑니다.
    - 배선 공사 없이 침대 옆이나 욕실에 부착만 하면 됩니다.
    - 방수 버튼이라 욕실에서도 사용 가능. 배터리 교체도 간단합니다.
    - 어떤 구성이 맞을지 문의 주시면 상황에 맞게 안내드립니다.

rsa_smartphone:
  pin_h1: true
  headlines:
    - 스마트폰 수신 비상벨
    - 거리 제한 없음
    - 원격으로 호출 수신
    - 어디서나 알림 확인
    - 공사 없이 설치
    - 누가 눌렀는지 표시
    - 헬로벨 공식스토어
    - 대량구매 견적상담
    - 설치 문의 환영
  descriptions:
    - 수신기 거리에 묶이지 않습니다. 스마트폰으로 어디서든 호출을 받으세요.
    - 어느 버튼이 눌렸는지 화면에 표시되어 위치를 바로 알 수 있습니다.
    - 배선 공사 없이 설치. 매장 병원 사무실 어디든 바로 적용됩니다.
    - 여러 명이 함께 알림을 받을 수 있어 놓치는 호출이 없습니다.

rsa_brand_bell:
  pin_h1: true
  headlines:
    - 헬로벨 공식스토어
    - 헬로팩토리 공식
    - 스마트 호출벨
    - 무선 비상벨 전문
    - 스마트폰으로 수신
    - 정품 A/S 보장
    - 당일 출고 가능
    - 대량구매 견적상담
  descriptions:
    - 헬로팩토리가 직접 운영하는 공식 스토어입니다. 정품과 A/S를 보장합니다.
    - 스마트폰으로 호출을 받는 무선 벨 시스템. 공사 없이 설치됩니다.
    - 매장 병원 학교 관공서 납품 실적. 대량 견적 상담 가능합니다.
    - 제품 선택이 고민되면 문의 주세요. 현장에 맞게 안내드립니다.

rsa_brand_click:
  pin_h1: true
  headlines:
    - 헬로클릭 공식
    - 학생응답시스템
    - 수업 참여 확인
    - 학교 렌탈 가능
    - 과목 단원 선택형
    - 헬로팩토리 공식
    - 도입 문의 환영
    - 견적서 발행 가능
  descriptions:
    - 헬로팩토리가 만든 학생응답시스템 헬로클릭 공식 안내 페이지입니다.
    - 학생 한 명 한 명의 참여도를 수업 중에 대시보드로 확인합니다.
    - 학교 렌탈로도 도입 가능. 예산 부담 없이 먼저 써볼 수 있습니다.
    - 도입 절차와 견적이 궁금하면 문의 주세요. 바로 안내드립니다.

rsa_srs:
  pin_h1: true
  headlines:
    - 학생응답시스템
    - 헬로클릭
    - 수업 참여도 확인
    - 전원 응답 실시간
    - 학교 렌탈 가능
    - 과목 단원 선택형
    - 설치 앱 필요 없음
    - 도입 문의 환영
    - 견적서 발행 가능
  descriptions:
    - 학생 전원의 응답을 실시간으로. 참여도를 대시보드에서 확인합니다.
    - 손 든 학생만이 아니라 모든 학생의 반응을 수업 중에 볼 수 있습니다.
    - 학교 렌탈로 부담 없이 도입. 견적서 발행도 바로 가능합니다.
    - 과목과 단원을 고르면 바로 수업에 쓸 수 있게 준비되어 있습니다.

rsa_class_tool:
  pin_h1: true
  headlines:
    - 수업 참여 도구
    - 학생 참여 유도
    - 전원 응답 실시간
    - 참여도 바로 확인
    - 헬로클릭
    - 학교 렌탈 가능
    - 준비 시간 5분
    - 도입 문의 환영
  descriptions:
    - 조용한 교실을 바꾸는 가장 빠른 방법. 학생 전원이 버튼으로 답합니다.
    - 누가 참여했는지 대시보드에 그대로. 평가 근거로도 활용됩니다.
    - 앱 설치나 기기 준비가 필요 없어 수업 시작 전 바로 쓸 수 있습니다.
    - 학교 렌탈 가능. 도입 절차와 견적을 바로 안내드립니다.

rsa_quiz:
  pin_h1: true
  headlines:
    - 퀴즈 버저 헬로클릭
    - 골든벨 수업 버저
    - 누른 순서 자동 표시
    - 전원 응답 실시간
    - 학교 렌탈 가능
    - 준비 시간 5분
    - 도입 문의 환영
    - 견적서 발행 가능
  descriptions:
    - 누가 먼저 눌렀는지 자동으로 표시. 골든벨과 스피드퀴즈에 그대로.
    - 학생 전원이 동시에 응답. 참여도가 대시보드에 바로 기록됩니다.
    - 앱 설치 없이 바로 사용. 수업 준비 시간을 줄여줍니다.
    - 학교 렌탈로도 도입 가능. 견적서 발행 바로 해드립니다.

rsa_school_buy:
  pin_h1: false
  headlines:
    - 학교 수업 기자재
    - 헬로클릭 렌탈
    - 예산 부담 없이 도입
    - 견적서 발행 가능
    - 학생응답시스템
    - 수업 참여도 확인
    - 도입 문의 환영
    - 학교 납품 실적
  descriptions:
    - 렌탈로 예산 부담 없이 먼저 도입해 보세요. 견적서 바로 발행됩니다.
    - 학생 전원의 수업 참여도를 실시간 대시보드로 확인하는 기자재입니다.
    - 학교 납품 실적 보유. 도입 절차와 필요 수량을 함께 잡아드립니다.
    - 어떤 구성이 맞을지 문의 주시면 학급 규모에 맞게 안내드립니다.

# 실적 근거: '무선 호출벨' 키워드가 CPA 5,031원 / 전환 57건으로 검색 전환의
# 절반 이상을 만들었습니다. 이 광고그룹은 별도 문안으로 방어합니다.
rsa_wireless_call:
  pin_h1: true
  headlines:
    - 무선 호출벨
    - 공사 없이 5분 설치
    - 스마트폰으로 호출 수신
    - 거리 제한 없는 호출벨
    - 매장 사무실 병원 어디든
    - 벨마다 다른 메시지 설정
    - 수신기 세트 구성
    - 당일 출고 가능
    - 세금계산서 발행
    - 대량구매 견적 상담
    - 헬로벨 공식 스토어
    - 정품 A/S 보장
  descriptions:
    - 배선 공사 없는 무선 호출벨. 부착만 하면 바로 사용할 수 있습니다.
    - 스마트폰으로 호출을 받아 수신기 거리에 얽매이지 않습니다.
    - 어느 벨이 눌렸는지 화면에 표시되어 위치를 바로 알 수 있습니다.
    - 대량 구매 견적과 세금계산서 발행 가능. 문의 주시면 바로 답변드립니다.
