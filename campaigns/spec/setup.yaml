# 신규 캠페인 설정 소스 (v3 — 검색량 검증 반영)
# 네이버 데이터랩 + 계정 Google 검색어 리포트 교차 검증으로
# 수요가 확인되지 않은 키워드와 광고그룹을 전부 제거했습니다.
budget:
  monthly: 200000
  days: 30.4
campaigns:
  - id: HB1
    name: "[검색] 헬로벨 | 호출벨·비상벨"
    product: 헬로벨
    share: 0.45
    goal: 구매 + 견적 문의
    conversions: HB_구매완료 · HB_시설견적_적격 · HB_전화_적격
    landing: 헬로벨 제품 랜딩 (자사몰)
    groups:
      - id: HB1A
        name: "AG_호출벨"
        max_cpc: 1200
        path: [무선, 호출벨]
        rsa: hb_call
        note: "수요 1위 (기준 대비 1.47배 · 계정 2년 노출 3,687)"
        exact: [호출벨, 무선 호출벨, 콜벨]
        phrase: [호출벨 가격, 무선 호출 벨, 업소용 호출벨, 매장 호출벨, 사무실 호출벨, 호출벨 설치]
      - id: HB1B
        name: "AG_비상벨"
        max_cpc: 1200
        path: [무선, 비상벨]
        rsa: hb_bell
        note: "기준 키워드 · 계정 2년 노출 8,267"
        exact: [비상벨, 무선 비상벨, 비상 호출벨]
        phrase: [무선 비상 벨, 비상벨 가격, 비상벨 설치, 비상벨 추천, 비상벨 시스템, 비상벨 세트]
      - id: HB1C
        name: "AG_브랜드"
        max_cpc: 400
        path: [헬로벨, 공식]
        rsa: hb_brand
        note: "자사 브랜드 수요는 기준의 4.5%. 별도 캠페인 없이 광고그룹으로만"
        exact: [헬로벨, 헬로팩토리, hellobell]
        phrase: [헬로벨 비상벨, 헬로벨 호출벨]
  - id: HB2
