        name: "AG_응급안전 (관찰)"
        max_cpc: 700
        path: [응급안전, 비상벨]
        rsa: hb_emergency
        note: >
          지자체 사업명이라 검색량은 크지만(기준 0.61배) 신청 정보를 찾는
          일반인 유입 위험이 큽니다. 정확일치만, 낮은 입찰, 첫 2주 검색어 매일 확인.
          부적합 유입이 많으면 즉시 중지합니다.
        exact: [응급안전안심서비스, 독거노인 응급안전]
        phrase: [응급안전 알림 서비스]
