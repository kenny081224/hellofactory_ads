    share: 0.03
    goal: 수요 존재 여부 확인
    conversions: HC_렌탈문의_적격 · HC_구매문의_적격
    landing: 헬로클릭 렌탈·구매 문의 랜딩
    groups:
      - id: HC1A
        name: "AG_HC_탐색"
        max_cpc: 2000
        path: [투표기, 대여]
        rsa: hc_probe
        note: >
          검색 수요가 거의 확인되지 않았습니다 (전 키워드 기준 0.005배 이하,
          계정 2년 노출 합계 55회). 예산을 태우지 않고 '정말 없는지' 확인하는
          최소 탐색용입니다. 8주 뒤 노출 500회 미만이면 중단하고 비검색 채널로 전환.
        exact: [헬로클릭, helloclick, 무선투표기, 전자투표기, 청중응답시스템]
        phrase: [무선투표기 대여, 전자투표기 대여, 청중응답시스템 대여, 투표기 대여, 무선 투표기 렌탈]
reserve_share: 0.0
