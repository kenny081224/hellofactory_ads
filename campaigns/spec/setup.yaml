# 신규 캠페인 설정 소스 (v6 — 실행 확정본)
# 변경: 매장용 스마트 호출벨은 별도 캠페인으로 분리하기로 확정되어
#       이번 세팅안에서 제외했습니다 (준비 사항은 문서 부록 참고).
#       AG_호출벨_검증 삭제, 예산을 Core → Care 로 재배분.
budget:
  monthly: 180000        # 활성 예산 (승인 상한 200,000 중)
  cap: 200000
  reserve: 20000
  days: 30.4
campaigns:
  - id: HB1
    name: "[S] HB_Emergency_비상벨"
    product: 헬로벨
    share: 0.3611
    goal: 온라인 구매 + 적격 견적 문의
    conversions: HB_구매완료 · HB_견적_적격 · HB_전화_적격
    landing: 헬로벨 비상벨 제품 랜딩 (자사몰)
    groups:
      - id: HB1A
        name: "AG_비상벨_핵심"
        max_cpc: 1300
        path: [무선, 비상벨]
        rsa: hb_bell
        note: >
          월 검색량 비상벨 880 · 무선 비상벨 70 · 비상 호출벨 50 = 1,000.
          '호출벨' 단독어는 매장용 수요라 이 캠페인에 넣지 않습니다.
          '비상 호출벨'은 응급 의도가 명확해 유지합니다.
        exact: [비상벨, 무선 비상벨, 비상 호출벨]
        phrase: [비상벨 가격, 비상벨 설치, 비상벨 시스템, 무선 비상벨 가격]
      - id: HB1B
        name: "AG_브랜드"
        max_cpc: 400
        path: [헬로벨, 공식]
        rsa: hb_brand
        landing_note: "자사몰 메인 (브랜드 검색자는 비상벨·호출벨 어느 쪽일지 모름)"
        note: "월 검색량 헬로벨 50 · 헬로팩토리 10. 공유 예산 안에서만 운영"
        exact: [헬로벨, 헬로팩토리, hellobell]
        phrase: []
  - id: HB2
    name: "[S] HB_Care_노인·돌봄"
    product: 헬로벨
    share: 0.3333
    goal: 개인 구매 + 보호자 문의
    conversions: HB_구매완료 · HB_견적_적격 · HB_전화_적격
    landing: 헬로벨 개인·보호자 랜딩
    groups:
      - id: HB2A
        name: "AG_노인안심벨"
        max_cpc: 1200
        path: [노인, 안심벨]
        rsa: hb_senior
        note: >
          최근 2년 실적 최고 효율 구간 (노인 안심벨 CPA 7,042원 · 노인 비상벨 14,848원).
          월 검색량 안심벨 210 · 독거노인 비상벨 40 · 노인 비상벨 30 = 280.
          호출벨 그룹이 빠지면서 이 캠페인 비중을 25% → 33.3% 로 올렸습니다.
        exact: [안심벨, 노인 안심벨, 노인 비상벨, 독거노인 비상벨]
        phrase: [어르신 비상벨, 부모님 안심벨, 독거노인 안심벨, 노인 응급벨]
      - id: HB2B
        name: "AG_응급안전_관찰"
        max_cpc: 700
        path: [응급안전, 비상벨]
        rsa: hb_emergency
        monthly_cap: 5000
        note: >
          월 검색량 390으로 크지만 정부 사업 신청·자격 정보 수요가 섞입니다.
          정확일치 1개만, 월 비용 한도 5,000원. 구매·설치 의도 검색어가
          30% 미만이면 중지. 검색량이 크다는 이유로 예산을 늘리지 않습니다.
        exact: [응급안전안심서비스]
        phrase: []
  - id: HB3
    name: "[S] HB_Facility_화장실·의료"
    product: 헬로벨
    share: 0.1944
    goal: 시설 견적 · 납품 상담
    conversions: HB_견적_적격 · HB_전화_적격
    landing: 헬로벨 시설용 랜딩
    groups:
      - id: HB3A
        name: "AG_화장실_도움벨"
        max_cpc: 1500
        path: [화장실, 비상벨]
        rsa: hb_toilet
        note: "월 검색량 화장실 비상벨 110 · 장애인 화장실 비상벨 90 · 장애인 도움벨 50 · 공중화장실 30"
        exact: [화장실 비상벨, 장애인 화장실 비상벨, 장애인 도움벨, 공중화장실 비상벨]
        phrase: [화장실 비상벨 설치, 장애인 화장실 호출벨, 공중화장실 비상벨 설치]
      - id: HB3B
        name: "AG_병원·기관"
        max_cpc: 1500
        path: [시설용, 비상벨]
        rsa: hb_facility
        note: >
          병원 호출벨은 키워드플래너 월 110으로 확인. 다만 간호사 호출 시스템
          (너스콜)이나 매장 호출벨로 오인될 수 있으므로 랜딩에서 구분 표기 필요.
        exact: [병원 호출벨, 학교 비상벨, 요양원 호출벨]
        phrase: [관공서 비상벨, 시설 비상벨 설치, 병원 호출벨 설치]
  - id: HC1
    name: "[S] HC_Intent_Test_구매·렌탈"
    product: 헬로클릭
    share: 0.1112
    goal: 행사·총회·청중응답 구매 또는 렌탈 문의
    conversions: HC_렌탈문의_적격 · HC_구매문의_적격
    landing: 헬로클릭 구매·렌탈 문의 랜딩 (신규 제작 필요)
    duration: 최초 8주 한정
    groups:
      - id: HC1A
        name: "AG_HC_구매"
        max_cpc: 2300
        path: [투표기, 구매]
        rsa: hc_buy
        note: "월 검색량 전자투표기 50 · 무선투표기 30 · 청중응답시스템 10"
        exact: [전자투표기, 무선투표기, 청중응답시스템, 헬로클릭, helloclick]
        phrase: [전자투표기 구매, 무선투표기 구매, 청중응답시스템 구매]
      - id: HC1B
        name: "AG_HC_렌탈"
        max_cpc: 2300
        path: [투표기, 대여]
        rsa: hc_rental
        note: "렌탈 수식어는 키워드플래너에서도 보고 가능한 검색량이 거의 없음. 제한 테스트"
        exact: [투표기 대여, 무선투표기 대여]
        phrase: [무선투표기 렌탈, 전자투표기 대여, 청중응답시스템 대여, 행사 투표기, 총회 투표기]
reserve_share: 0.0

# ── 이번 세팅안에서 제외한 것 (별도 캠페인으로 분리 예정) ──────────────
deferred:
  - id: HB_Store
    name: "[S] HB_Store_매장 스마트 호출벨"
    reason: >
      매장·식당용 스마트 호출벨은 구매자(점주·매장 관리자)와 랜딩, 소구점이
      비상벨과 완전히 달라 별도 캠페인으로 분리하기로 확정했습니다.
      이번 세팅안에는 포함하지 않습니다.
    inventory: "월 검색량 호출벨 480 · 무선 호출벨 70 = 550 (비상벨 다음으로 큼)"
    prepare:
      - 매장용 호출벨 전용 랜딩 (주문·직원 호출 시나리오)
      - "매장용 전환 액션 분리 (HB_Store_구매완료 / HB_Store_견적_적격)"
      - "키워드 후보 — 호출벨 / 무선 호출벨 / 식당 호출벨 / 카페 호출벨 / 테이블 호출벨 / 직원 호출벨 / 서빙벨 / 매장 호출벨 / 업소용 호출벨"
      - 예산: 별도 배정 (이번 180,000원에서 빼지 않음)
