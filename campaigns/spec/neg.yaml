# 제외 키워드 (v6)
# 매장·식당용 호출벨 관련어를 헬로벨 비상벨 캠페인의 제외어로 편입했습니다.
#   매장 수요는 별도 캠페인(HB_Store)이 받아야 하므로, 비상벨 캠페인이
#   가로채면 문안·랜딩이 맞지 않아 낭비가 됩니다.
#   HB_Store 캠페인을 만들 때는 이 단어들을 그 캠페인의 키워드로 씁니다.
# 계정 공통에서 무료·중고·도매·부품은 제외하지 않습니다 (B2B 의도 보호).
