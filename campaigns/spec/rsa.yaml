# 반응형 검색광고 문안 (v3)
# 금지 표현: 낙상 '자동 감지', 119 자동 연결, 생명·안전을 보장하는 단정 표현
# 제품은 '버튼을 눌러' 알리는 방식이므로 자동 감지처럼 읽히는 문구를 쓰지 않습니다.
hb_call:
  pin_h1: true
  headlines: [무선 호출벨, 스마트폰으로 호출 수신, 수신기 앞에 없어도, 버튼별 메시지 지정,
    누가 처리했는지 공유, 번호 대신 문구로 전달, 여러 명 동시 수신, 배선 공사 필요 없음,
    배터리 잔량 원격 확인, 대시보드 처리 로그, 매장 사무실 병원까지, 대량 구매 상담,
    세금계산서 발행, 헬로벨 공식]
  descriptions:
    - 고정 수신기 앞에 있지 않아도 스마트폰과 워치로 호출을 받습니다.
    - 번호만 뜨는 방식이 아니라 무슨 요청인지 문구로 전달됩니다.
    - 직원이 요청을 수락하면 상태가 공유되어 중복 대응이 줄어듭니다.
    - 현장과 수량을 알려주시면 구성과 견적을 잡아 드립니다.
hb_bell:
  pin_h1: true
  headlines: [무선 비상벨, 공사 없이 부착 설치, 스마트폰으로 즉시 수신, 벨마다 메시지 지정,
    수신자 지정 가능, 처리 여부까지 기록, 배터리 잔량 원격 확인, 수신기 연결 상태 확인,
    방수 버튼 사용, 대량 납품 상담, 세금계산서 발행, 설치 상담 무료, 헬로벨 공식]
  descriptions:
    - 배선 공사 없이 부착만 하면 바로 사용할 수 있는 무선 비상벨입니다.
    - 벨마다 다른 문구와 받을 사람을 지정해 상황을 정확히 전달합니다.
    - 배터리 잔량과 수신기 연결 상태를 대시보드에서 확인합니다.
    - 설치 현장과 수량을 알려주시면 견적을 드립니다.
hb_brand:
  pin_h1: true
  headlines: [헬로벨 공식, 헬로팩토리 공식, 원격 수신 호출 시스템, 정품 A/S 보장,
    버튼별 메시지 지정, 처리 상태까지 공유, 대시보드 통계 제공, 가정 시설 모두 대응,
    상담 후 견적 안내]
  descriptions:
    - 헬로팩토리가 직접 운영하는 공식 채널입니다. 정품과 A/S를 보장합니다.
    - 버튼별로 메시지와 받을 사람을 지정하는 호출 메시지 플랫폼입니다.
    - 스마트폰과 워치로 받고 누가 처리했는지까지 함께 확인합니다.
    - 가정 요양시설 공공화장실까지 환경에 맞춰 상담해 드립니다.
hb_senior:
  pin_h1: true
  headlines: [노인 안심벨, 독거 어르신 안심벨, 버튼 누르면 보호자에게, 가족 여러 명 동시 알림,
    스마트워치로도 확인, 욕실에도 방수 설치, 배선 공사 필요 없음, 어느 방에서 눌렀는지,
    배터리 2년 사용, 부착만 하면 설치 끝, 수신 거리 걱정 없이, 헬로벨 공식 스토어]
  descriptions:
    - 버튼을 누르면 지정한 보호자에게 도움 요청 메시지가 전달됩니다.
    - 어느 방에서 눌렀는지 문구로 전달돼 상황을 바로 알 수 있습니다.
    - 방수 버튼이라 욕실에도 붙일 수 있고 배터리는 2년 갑니다.
    - 가족 여러 명이 함께 받을 수 있어 놓치는 호출이 없습니다.
hb_emergency:
  pin_h1: true
  headlines: [독거 어르신 응급 호출, 보호자와 담당자 동시, 버튼 누르면 메시지 전달,
    처리 여부까지 기록, 대시보드로 통합 관리, 배터리 잔량 원격 확인, 수신 그룹 지정,
    상담 후 견적 안내, 세금계산서 발행]
  descriptions:
    - 버튼을 누르면 보호자와 담당자에게 동시에 메시지가 전달됩니다.
    - 누가 확인하고 처리했는지 기록되어 중복 대응이 줄어듭니다.
    - 벨 위치와 배터리 잔량을 원격으로 확인해 방치를 막습니다.
    - 대상 가구 수와 운영 방식을 알려주시면 구성을 제안드립니다.
hb_toilet:
  pin_h1: true
  headlines: [화장실 비상벨 설치, 장애인화장실 도움벨, 담당자 부재에도 전달,
    어느 칸인지 문구로 표시, 스마트폰으로 즉시 수신, 배터리 잔량 원격 확인,
    수신기 연결 상태 확인, 방수 버튼 사용, 배선 공사 필요 없음, 관공서 학교 납품,
    세금계산서 발행, 설치 상담 무료]
  descriptions:
    - 벨마다 다른 문구를 지정해 어느 화장실 어느 칸인지 표시됩니다.
    - 고정 수신기 앞에 사람이 없어도 담당자 스마트폰과 워치로 갑니다.
    - 배터리 잔량과 수신기 연결 상태를 대시보드에서 확인합니다.
    - 현장 사진을 주시면 구성과 수량을 잡아 견적 드립니다.
hb_facility:
  pin_h1: true
  headlines: [시설용 무선 호출벨, 병원 요양원 학교, 스마트폰 워치로 수신,
    누가 처리했는지 공유, 벨별 메시지 지정, 대시보드 처리 로그, 배터리 잔량 원격 확인,
    대량 납품 상담, 세금계산서 발행, 설치 상담 무료]
  descriptions:
    - 어느 위치의 어떤 요청인지 문구로 전달돼 확인하러 갈 필요가 없습니다.
    - 직원이 요청을 수락하면 상태가 공유되어 중복 대응이 줄어듭니다.
    - 벨 위치와 처리 로그를 대시보드에서 한 번에 관리합니다.
    - 시설 규모와 층 구조를 알려주시면 구성과 견적을 잡아 드립니다.
hc_probe:
  pin_h1: true
  headlines: [무선 투표기 대여, 청중 응답기 렌탈, 현장 온라인 동시 집계,
    결과 실시간 그래프, 프로그램 설치 불필요, 연결 대수 제한 없음,
    대여 구매 모두 가능, 당일 견적서 발행, 헬로클릭 공식]
  descriptions:
    - 행사 규모에 맞춰 대여합니다. 인원과 일정만 알려주시면 견적 드립니다.
    - 현장 클릭커와 스마트폰 참여 결과를 한 화면에서 함께 집계합니다.
    - 웹브라우저로 운영해 PC마다 프로그램을 설치할 필요가 없습니다.
    - 총회 컨퍼런스 기업행사에 씁니다. 행사일을 알려주세요.
