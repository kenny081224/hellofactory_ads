bell_gov:
  pin_h1: true
  headlines: [독거노인 응급 비상벨, 낙상 즉시 보호자 알림, 지자체 납품용 응급벨,
    대시보드로 통합 관리, 배터리 잔량 원격 확인, 보호자 여러 명 동시 수신,
    처리 여부까지 자동 기록, 벨마다 메시지 지정, KC FCC CE 인증, 국내외 특허 등록,
    수신거리 제한 없음, 무료 상담 후 견적, 세금계산서 발행, 헬로벨 공식, 대량 납품 상담]
  descriptions:
    - 버튼을 누르면 보호자와 담당 직원 스마트폰으로 동시에 메시지가 갑니다.
    - 누가 확인했고 처리했는지까지 대시보드에 기록됩니다. 중복 출동이 없습니다.
    - 배터리 잔량과 수신기 연결 상태를 원격으로 확인해 방치를 막습니다.
    - 돌봄 대상 가구 수만 알려주시면 구성과 견적을 잡아 드립니다.
bell_public:
  pin_h1: true
  headlines: [화장실 비상벨 설치, 장애인화장실 도움벨, 담당자 부재에도 대응,
    스마트폰으로 즉시 수신, 어느 칸인지 문구로 표시, 배터리 잔량 원격 확인,
    방수 버튼 IPX6 등급, 벨마다 메시지 지정, 관공서 학교 납품, 세금계산서 발행,
    설치 상담 무료, 배선 공사 필요 없음, KC FCC CE 인증, 헬로벨 공식]
  descriptions:
    - 벨마다 다른 문구를 지정해 어느 화장실 어느 칸인지 바로 표시됩니다.
    - 고정 수신기 앞에 사람이 없어도 담당자 스마트폰과 워치로 전달됩니다.
    - 배터리 방전으로 무용지물이 되는 문제를 잔량 원격 확인으로 막습니다.
    - 관공서 학교 납품 실적. 현장 사진 주시면 구성과 수량을 잡아 드립니다.
bell_care:
  pin_h1: true
  headlines: [요양원 무선 호출벨, 병상 호출 스마트폰 수신, 수신거리 제한 없음,
    누가 처리했는지 공유, 간호사 워치로 알림, 벨마다 메시지 지정,
    대시보드 통계 제공, 배터리 잔량 원격 확인, 방수 버튼 IPX6 등급,
    대량 납품 상담, 세금계산서 발행, 배선 공사 필요 없음, 헬로벨 공식]
  descriptions:
    - 호출을 받은 직원이 수락하면 상태가 공유되어 중복 대응이 없습니다.
    - 어느 병상 어느 요청인지 문구로 전달돼 확인하러 갈 필요가 없습니다.
    - 스마트워치로도 받을 수 있어 이동 중에도 호출을 놓치지 않습니다.
    - 요양원 요양병원 납품 실적. 병상 수 알려주시면 견적 드립니다.
bell_home:
  pin_h1: true
  headlines: [독거 어르신 안심벨, 낙상 사고 즉시 알림, 보호자 폰으로 바로 전달,
    욕실에도 방수 설치, 배선 공사 필요 없음, 가족 여러 명 동시 수신,
    배터리 2년 사용, 수신거리 제한 없음, 어느 방에서 눌렀는지, 부착만 하면 설치 끝,
    헬로벨 공식 스토어, 당일 출고 가능]
  descriptions:
    - 방 욕실 거실에 붙여두면 버튼 한 번으로 가족에게 바로 연락됩니다.
    - 어르신 낙상은 74퍼센트가 집에서 일어납니다. 방과 욕실이 가장 많습니다.
    - 방수 버튼이라 욕실에도 붙일 수 있고 배터리는 2년 갑니다.
    - 가족 여러 명이 함께 받을 수 있어 놓치는 호출이 없습니다.
click_rental:
  pin_h1: true
  headlines: [무선 투표기 대여, 행사용 전자투표기, 청중응답시스템 렌탈,
    수신거리 80미터, 연결 대수 제한 없음, 온오프라인 동시 집계, 결과 실시간 그래프,
    프로그램 설치 불필요, 웹브라우저로 바로 운영, 배터리 2년 사용,
    당일 견적서 발행, 전국 배송 설치, 대여 구매 모두 가능, 헬로클릭 공식]
  descriptions:
    - 행사 규모에 맞춰 대여합니다. 참가자 수만 알려주시면 견적 드립니다.
    - 현장 투표와 온라인 투표를 한 화면에서 동시에 집계합니다.
    - 연결 대수 제한이 없고 수신거리 80미터라 큰 홀에서도 씁니다.
    - 웹브라우저로 운영해 PC마다 프로그램을 설치할 필요가 없습니다.
click_meeting:
  pin_h1: true
  headlines: [총회 전자투표 장비, 임원선거 무선투표기, 안건 의결 찬반투표,
    결과 즉시 집계 발표, 온오프라인 동시 집계, 아파트 총회 사용 실적,
    연결 대수 제한 없음, 참석자 매핑 지원, 대여 구매 모두 가능,
    당일 견적서 발행, 전국 배송 설치, 헬로클릭 공식]
  descriptions:
    - 안건별 찬반을 즉시 집계해 회의 중에 결과를 발표할 수 있습니다.
    - 현장 참석자와 온라인 참여자를 한 번에 집계합니다.
    - 아파트 입주자대표회의 조합 총회 임원선거에 쓰이고 있습니다.
    - 대여와 구매 모두 가능합니다. 인원과 일정 알려주시면 안내드립니다.
click_quiz:
  pin_h1: true
  headlines: [골든벨 장비 대여, 퀴즈쇼 무선 버저, 정답 자동 채점,
    누가 먼저 눌렀는지 표시, 버튼 8개 구성, 배터리 2년 사용,
    연결 대수 제한 없음, 행사 일정 맞춰 배송, 당일 견적서 발행, 헬로클릭 공식]
  descriptions:
    - 정답이 자동 채점되어 진행자가 따로 계산할 필요가 없습니다.
    - 누가 먼저 눌렀는지 순서가 표시돼 스피드 퀴즈에 그대로 씁니다.
    - 참가 인원에 맞춰 대여합니다. 행사일 알려주시면 일정 잡아 드립니다.
    - 코인 건전지가 아닌 AAA 건전지라 교체 걱정이 없습니다.
brand_bell:
  pin_h1: true
  headlines: [헬로벨 공식, 헬로팩토리 공식몰, 원격 수신 비상벨,
    스마트폰으로 호출 수신, 정품 A/S 보장, 벨마다 메시지 지정,
    대시보드 통계 제공, 당일 출고 가능, 대량 납품 상담, 세금계산서 발행]
  descriptions:
    - 헬로팩토리가 직접 운영하는 공식 채널입니다. 정품과 A/S를 보장합니다.
    - 버튼별로 메시지와 수신자를 지정하는 호출 플랫폼입니다.
    - 관공서 학교 요양시설 납품 실적. 대량 견적 상담 가능합니다.
    - 어떤 구성이 맞을지 문의 주시면 현장에 맞게 안내드립니다.
brand_click:
  pin_h1: true
  headlines: [헬로클릭 공식, 청중응답시스템, 무선투표기 대여,
    온오프라인 동시 집계, 연결 대수 제한 없음, 수신거리 80미터,
    대여 구매 모두 가능, 당일 견적서 발행, 헬로팩토리 공식]
  descriptions:
    - 헬로팩토리가 만든 실시간 청중응답시스템 헬로클릭 공식 안내입니다.
    - 행사 총회 교육까지 한 장비로. 결과가 실시간 그래프로 나옵니다.
    - 대여와 구매 모두 가능합니다. 인원과 일정 알려주시면 안내드립니다.
    - 학교 기업 기관 도입 실적 보유. 견적서 바로 발행해 드립니다.
