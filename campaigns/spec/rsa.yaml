# 반응형 검색광고 문안 (v2)
# 금지 표현: 낙상 '자동 감지', 119 자동 연결, 생명·안전을 보장하는 단정 표현
# 제품은 '버튼을 눌러' 알리는 방식이므로 자동 감지처럼 읽히는 문구를 쓰지 않습니다.
br_bell:
  pin_h1: true
  headlines: [헬로벨 공식, 헬로팩토리 공식, 원격 수신 비상벨, 스마트폰으로 호출 수신,
    버튼별 메시지 지정, 처리 상태까지 공유, 대시보드 통계 제공, 정품 A/S 보장,
    가정 시설 모두 대응, 상담 후 견적 안내]
  descriptions:
    - 헬로팩토리가 직접 운영하는 공식 채널입니다. 정품과 A/S를 보장합니다.
    - 버튼별로 메시지와 수신자를 지정하는 호출 메시지 플랫폼입니다.
    - 스마트폰과 워치로 받고 누가 처리했는지까지 함께 확인합니다.
    - 가정 요양시설 공공화장실까지 환경에 맞춰 상담해 드립니다.
br_click:
  pin_h1: true
  headlines: [헬로클릭 공식, 청중응답 시스템, 무선 투표기 렌탈, 구매 상담도 가능,
    현장과 온라인 동시 집계, 결과 실시간 그래프, 웹브라우저로 운영, 행사 규모별 견적,
    헬로팩토리 공식]
  descriptions:
    - 헬로팩토리가 만든 실시간 청중응답 시스템 헬로클릭 공식 안내입니다.
    - 무선 클릭커와 스마트폰 응답을 함께 집계해 결과를 바로 보여줍니다.
    - 일회성 행사는 렌탈로 반복 행사는 구매로 상담해 드립니다.
    - 인원과 일정을 알려주시면 구성과 견적을 안내해 드립니다.
hb_home:
  pin_h1: true
  headlines: [독거 어르신 안심벨, 버튼 누르면 보호자에게, 가족 여러 명 동시 알림,
    스마트워치로도 확인, 욕실에도 방수 설치, 배선 공사 필요 없음, 수신 거리 걱정 없이,
    어느 방에서 눌렀는지, 배터리 2년 사용, 부착만 하면 설치 끝, 헬로벨 공식 스토어]
  descriptions:
    - 버튼을 누르면 지정한 보호자에게 도움 요청 메시지가 전달됩니다.
    - 어느 방에서 눌렀는지 문구로 전달돼 상황을 바로 알 수 있습니다.
    - 방수 버튼이라 욕실에도 붙일 수 있고 배터리는 2년 갑니다.
    - 가족 여러 명이 함께 받을 수 있어 놓치는 호출이 없습니다.
hb_remote:
  pin_h1: true
  headlines: [원격 수신 비상벨, 스마트폰으로 호출 수신, 스마트워치에서도 확인,
    수신기 앞에 없어도, 버튼별 메시지 지정, 여러 수신자 동시 전달, 요청 수락과 상태 공유,
    번호 대신 문구로 전달, 배선 공사 필요 없음, 헬로벨 공식]
  descriptions:
    - 고정 수신기 앞에 있지 않아도 스마트폰과 워치로 메시지를 받습니다.
    - 번호만 뜨는 방식이 아니라 상황을 설명하는 문구가 전달됩니다.
    - 수신자가 요청을 수락하면 상태가 공유돼 중복 대응이 줄어듭니다.
    - 사용 환경을 알려주시면 맞는 구성을 안내해 드립니다.
hb_care:
  pin_h1: true
  headlines: [요양시설 무선 호출벨, 병상 호출 스마트폰 수신, 간호사 워치로 알림,
    누가 처리했는지 공유, 벨별 메시지 지정, 대시보드 처리 로그, 배터리 잔량 원격 확인,
    수신기 연결 상태 확인, 배선 공사 필요 없음, 대량 납품 상담, 세금계산서 발행]
  descriptions:
    - 어느 병상 어느 요청인지 문구로 전달돼 확인하러 갈 필요가 없습니다.
    - 직원이 요청을 수락하면 상태가 공유되어 중복 대응이 줄어듭니다.
    - 벨 위치와 처리 로그를 대시보드에서 한 번에 관리합니다.
    - 병상 수와 층 구조를 알려주시면 구성과 견적을 잡아 드립니다.
hb_public:
  pin_h1: true
  headlines: [화장실 비상벨 설치, 장애인화장실 도움벨, 담당자 부재에도 전달,
    어느 칸인지 문구로 표시, 스마트폰으로 즉시 수신, 배터리 잔량 원격 확인,
    수신기 연결 상태 확인, 방수 버튼 사용, 배선 공사 필요 없음, 관공서 학교 납품,
    세금계산서 발행, 설치 상담 무료]
  descriptions:
    - 벨마다 다른 문구를 지정해 어느 화장실 어느 칸인지 표시됩니다.
    - 고정 수신기 앞에 사람이 없어도 담당자 스마트폰과 워치로 갑니다.
    - 배터리 잔량과 수신기 연결 상태를 대시보드에서 확인합니다.
    - 현장 사진을 주시면 구성과 수량을 잡아 견적 드립니다.
hb_gov:
  pin_h1: true
  headlines: [독거 어르신 응급 호출, 보호자와 담당자 동시, 버튼 누르면 메시지 전달,
    처리 여부까지 기록, 대시보드로 통합 관리, 배터리 잔량 원격 확인, 벨별 메시지 지정,
    수신 그룹 지정 가능, 상담 후 견적 안내, 세금계산서 발행]
  descriptions:
    - 버튼을 누르면 보호자와 담당자에게 동시에 메시지가 전달됩니다.
    - 누가 확인하고 처리했는지 대시보드에 기록되어 중복 출동이 줍니다.
    - 벨 위치와 배터리 잔량을 원격으로 확인해 방치를 막습니다.
    - 대상 가구 수와 운영 방식을 알려주시면 구성을 제안드립니다.
hc_rental:
  pin_h1: true
  headlines: [무선 투표기 대여, 행사용 전자투표기 렌탈, 청중 응답기 대여,
    행사 규모에 맞춰 견적, 클릭커와 스마트폰 함께, 현장 온라인 동시 집계,
    결과 실시간 그래프, 프로그램 설치 불필요, 당일 견적서 발행, 배송 설치 회수 상담,
    헬로클릭 공식]
  descriptions:
    - 행사 규모에 맞춰 대여합니다. 인원과 일정만 알려주시면 견적 드립니다.
    - 현장 클릭커와 스마트폰 참여 결과를 한 화면에서 함께 집계합니다.
    - 웹브라우저로 운영해 PC마다 프로그램을 설치할 필요가 없습니다.
    - 배송 설치 회수까지 상담해 드립니다. 행사일을 알려주세요.
hc_event:
  pin_h1: true
  headlines: [행사 청중 응답 시스템, 컨퍼런스 실시간 투표, 세미나 현장 설문,
    청중 평가단 운영, 현장 온라인 동시 집계, 결과 실시간 그래프, QR로 스마트폰 참여,
    이름 번호 좌석 매핑, 행사 규모별 렌탈 견적, 헬로클릭 공식]
  descriptions:
    - 강연 중 청중 반응을 모아 실시간 그래프로 바로 보여줍니다.
    - 현장 참석자와 온라인 참여자의 응답을 한 번에 집계합니다.
    - QR로 접속해 이름이나 번호를 고르면 스마트폰으로도 참여합니다.
    - 컨퍼런스 세미나 포럼 규모에 맞춰 렌탈 견적을 안내합니다.
hc_quiz:
  pin_h1: true
  headlines: [골든벨 장비 대여, 행사 퀴즈 시스템, OX 퀴즈 장비 렌탈,
    정답 자동 채점, 누른 순서 표시, 참가 인원에 맞춰 대여, 배터리 2년 사용,
    행사 일정 맞춰 배송, 당일 견적서 발행, 헬로클릭 공식]
  descriptions:
    - 정답이 자동 채점되어 진행자가 따로 계산할 필요가 없습니다.
    - 누가 먼저 눌렀는지 순서가 표시돼 스피드 퀴즈에 그대로 씁니다.
    - 참가 인원에 맞춰 대여합니다. 행사일 알려주시면 일정 잡아 드립니다.
    - 코인 건전지가 아닌 AAA 건전지라 교체 걱정이 줄어듭니다.
hc_buy:
  pin_h1: true
  headlines: [무선 투표기 구매, 청중 응답 시스템 도입, 현장 행사 회의용 장비,
    현장 온라인 응답 통합, 웹 기반으로 운영, 문제 업로드와 공유, 이름 번호 좌석 매핑,
    구매 수량별 구성 안내, 데모 신청 가능, 헬로클릭 공식]
  descriptions:
    - 현장 행사와 회의에 쓰는 장비입니다. 수량별 구성을 안내드립니다.
    - 무선 클릭커와 스마트폰 응답을 함께 집계하고 데이터로 남깁니다.
    - 웹브라우저에서 운영해 PC마다 설치할 필요가 없습니다.
    - 반복 운영이 잦다면 구매가 유리합니다. 데모부터 신청해 보세요.
hc_corp:
  pin_h1: true
  headlines: [기업 교육 청중 응답, 사내 교육 투표 시스템, 타운홀 미팅 투표,
    워크숍 의견 수집, 응답 결과 실시간 확인, 참여자별 데이터 관리, 웹 기반으로 운영,
    현장 행사 회의용 장비, 도입 상담 견적, 헬로클릭 공식]
  descriptions:
    - 신입 교육 만족도 조사 질의응답까지 한 장비로 처리합니다.
    - 참여자별 응답을 이름과 번호로 관리해 보고서로 정리하기 쉽습니다.
    - 웹브라우저에서 운영하고 결과를 실시간 그래프로 확인합니다.
    - 연간 교육 횟수를 알려주시면 구매와 렌탈을 비교해 드립니다.
hc_meeting:
  pin_h1: true
  headlines: [총회 현장 투표 시스템, 협회 총회 투표기, 임원 선거 투표기,
    안건 의결 즉시 집계, 현장 온라인 동시 집계, 결과 바로 발표 가능,
    현장 행사 회의용 장비, 참석자 명단 매핑, 대여 구매 모두 가능, 헬로클릭 공식]
  descriptions:
    - 안건별 찬반을 즉시 집계해 회의 중에 결과를 발표할 수 있습니다.
    - 현장 참석자와 온라인 참여자의 응답을 한 번에 모읍니다.
    - 참석자를 이름이나 번호로 매핑해 응답 기록을 남깁니다.
    - 현장 행사와 회의용 장비입니다. 인원과 일정을 알려주세요.
